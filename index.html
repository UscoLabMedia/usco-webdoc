<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>USCO WebDoc - Recorrido Interactivo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    }

    /* PANTALLA DE INICIO (LANDING / COVER) */
    #pantalla-inicio {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3000; background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(0, 0, 0, 0.9)), url('1.png');
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #ffffff; text-align: center; padding: 20px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      touch-action: auto;
    }

    #pantalla-inicio.oculto {
      opacity: 0; visibility: hidden; pointer-events: none;
    }

    .meta-tag {
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      color: #38bdf8; font-weight: 700; margin-bottom: 12px;
    }

    .titulo-principal {
      font-size: 2.2rem; font-weight: 800; margin: 0 0 10px 0;
      letter-spacing: -1px; text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .subtitulo {
      font-size: 1rem; color: #cbd5e1; max-width: 550px;
      margin: 0 0 30px 0; line-height: 1.5; font-weight: 300;
    }

    .instrucciones-grid {
      display: flex; gap: 15px; margin-bottom: 35px; justify-content: center; flex-wrap: wrap;
    }

    .item-instruccion {
      background: rgba(255, 255, 255, 0.08); padding: 10px 16px;
      border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px); font-size: 13px; color: #e2e8f0;
    }

    #btn-entrar {
      background: linear-gradient(135deg, #EF2D5E, #b91c1c);
      color: #ffffff; border: none; padding: 16px 42px; border-radius: 40px;
      font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; cursor: pointer;
      box-shadow: 0 0 25px rgba(239, 45, 94, 0.5); transition: all 0.3s ease;
    }

    #hud {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.85); padding: 10px 20px;
      border-radius: 25px; z-index: 100; pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2); text-align: center; font-size: 13px;
      width: 90%; max-width: 450px;
    }

    /* VISOR DE FOTOS Y CAPA DE GESTOS */
    #visor-caminata {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; z-index: 1; background: #000;
      pointer-events: none;
    }

    #capa-touch {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; touch-action: none;
    }

    a-scene {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3; pointer-events: none;
    }

    #modal-youtube {
      display: none; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 90%; max-width: 800px;
      height: 250px; background: #000; border: 2px solid #EF2D5E;
      border-radius: 12px; z-index: 4000; box-shadow: 0 0 30px rgba(239, 45, 94, 0.5);
    }

    @media (min-height: 500px) { #modal-youtube { height: 400px; } }

    #modal-youtube iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }

    #btn-cerrar-video {
      position: absolute; top: -15px; right: -15px; background: #EF2D5E;
      color: white; border: none; width: 35px; height: 35px; border-radius: 50%;
      font-weight: bold; cursor: pointer; font-size: 16px; z-index: 4001;
    }
  </style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

  <!-- PANTALLA DE INICIO -->
  <div id="pantalla-inicio">
    <div class="meta-tag">Universidad Surcolombiana</div>
    <h1 class="titulo-principal">RECORRIDO INTERACTIVO</h1>
    <p class="subtitulo">Experiencia transmedia documental por los espacios del campus.</p>
    
    <div class="instrucciones-grid">
      <div class="item-instruccion">🖱️ Scroll en PC</div>
      <div class="item-instruccion">📱 Desliza verticalmente en celular</div>
    </div>

    <button id="btn-entrar" onclick="iniciarExperiencia()">ENTRAR AL RECORRIDO</button>
  </div>

  <div id="hud">Foto 1 de 10 | Desliza el dedo verticalmente para caminar</div>

  <img id="visor-caminata" src="1.png" alt="Caminata">
  <div id="capa-touch"></div>

  <div id="modal-youtube">
    <button id="btn-cerrar-video" onclick="cerrarVideo()">✕</button>
    <iframe id="iframe-yt" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>

  <a-scene embedded vr-mode-ui="enabled: true">
    <a-assets>
      <img id="asset-playboton" src="playboton.png">
    </a-assets>

    <a-entity id="hotspot-video" position="0 1.6 -1.8" visible="false">
      <a-image id="btn-video" class="clickable" src="#asset-playboton" width="0.25" height="0.25"
               animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; loop: true; dur: 800">
      </a-image>
      <a-text id="txt-titulo-video" value="Video 1" position="0 -0.22 0" align="center" 
              color="#FFFFFF" scale="0.75 0.75 0.75"></a-text>
    </a-entity>

    <a-entity id="rig">
      <a-camera look-controls="pointerLockEnabled: false; touchEnabled: false">
        <a-cursor color="#EF2D5E" raycaster="objects: .clickable" fuse="false"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>

  <script>
    let pasoActual = 1;
    const totalPasos = 10;
    let videoAbierto = false;
    let puedoAvanzar = true;
    let experienciaIniciada = false;

    const mapaVideos = {
      3: { id: "x1bnsYS8mHE", texto: "Video 1" },
      6: { id: "uXTm0gAP2F8", texto: "Video 2" },
      9: { id: "ZUm8kf2SC9g", texto: "Video 3" }
    };

    const pantallaInicio = document.getElementById('pantalla-inicio');
    const imgVisor = document.getElementById('visor-caminata');
    const capaTouch = document.getElementById('capa-touch');
    const hotspot = document.getElementById('hotspot-video');
    const btnVideo = document.getElementById('btn-video');
    const txtTitulo = document.getElementById('txt-titulo-video');
    const modalYT = document.getElementById('modal-youtube');
    const iframeYT = document.getElementById('iframe-yt');
    const hud = document.getElementById('hud');

    // PRECARGA DE IMÁGENES EN MEMORIA RAM (Evita demoras en móviles)
    const imágenesCargadas = {};
    function precargarSecuencia() {
      for (let i = 1; i <= totalPasos; i++) {
        imágenesCargadas[i] = new Image();
        imágenesCargadas[i].src = `${i}.png`;
      }
    }

    function iniciarExperiencia() {
      precargarSecuencia();
      pantallaInicio.classList.add('oculto');
      experienciaIniciada = true;
    }

    function cambiarFotograma(direccion) {
      if (!experienciaIniciada || videoAbierto || !puedoAvanzar) return;

      const nuevoPaso = pasoActual + direccion;
      if (nuevoPaso < 1 || nuevoPaso > totalPasos) return;

      puedoAvanzar = false;
      pasoActual = nuevoPaso;

      // Actualizar imagen usando los objetos precargados
      if (imágenesCargadas[pasoActual] && imágenesCargadas[pasoActual].src) {
        imgVisor.src = imágenesCargadas[pasoActual].src;
      } else {
        imgVisor.src = `${pasoActual}.png`;
      }

      if (mapaVideos[pasoActual]) {
        hotspot.setAttribute('visible', 'true');
        btnVideo.classList.add('clickable');
        txtTitulo.setAttribute('value', mapaVideos[pasoActual].texto);
        document.querySelector('a-scene').style.pointerEvents = 'auto';
        hud.innerText = `Foto ${pasoActual} de ${totalPasos} | Toca el botón para abrir el ${mapaVideos[pasoActual].texto}`;
      } else {
        hotspot.setAttribute('visible', 'false');
        btnVideo.classList.remove('clickable');
        document.querySelector('a-scene').style.pointerEvents = 'none';
        hud.innerText = `Foto ${pasoActual} de ${totalPasos} | Desliza hacia arriba/abajo para avanzar`;
      }

      setTimeout(() => { puedoAvanzar = true; }, 120);
    }

    btnVideo.addEventListener('click', () => {
      const data = mapaVideos[pasoActual];
      if (data) {
        iframeYT.src = `https://www.youtube.com/embed/${data.id}?autoplay=1`;
        modalYT.style.display = 'block';
        videoAbierto = true;
      }
    });

    function cerrarVideo() {
      iframeYT.src = "";
      modalYT.style.display = 'none';
      videoAbierto = false;
    }

    // CONTROL POR SCROLL (PC)
    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 0) cambiarFotograma(1);
      else if (e.deltaY < 0) cambiarFotograma(-1);
    });

    // CONTROL TÁCTIL MEJORADO PARA CELULARES
    let startY = 0;

    capaTouch.addEventListener('touchstart', (e) => {
      if (!experienciaIniciada) return;
      startY = e.touches[0].clientY;
    }, { passive: false });

    capaTouch.addEventListener('touchmove', (e) => {
      if (!experienciaIniciada || videoAbierto) return;
      e.preventDefault();
      
      let endY = e.touches[0].clientY;
      let diferenciaY = startY - endY;

      if (Math.abs(diferenciaY) > 20) { // Sensibilidad ajustada a 20px
        if (diferenciaY > 0) {
          cambiarFotograma(1);  // Deslizar arriba -> foto siguiente
        } else {
          cambiarFotograma(-1); // Deslizar abajo -> foto anterior
        }
        startY = endY;
      }
    }, { passive: false });
  </script>

</body>
</html>
